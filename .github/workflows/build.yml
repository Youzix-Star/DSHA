name: Build

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dsha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach APK to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: dsha-debug-apk
          path: dist

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          find dist -type f | sort
          APK="$(find dist -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::下载的产物中没有找到 APK"
            exit 1
          fi
          mkdir -p upload
          cp "$APK" "upload/dsha-${GITHUB_REF_NAME}-debug.apk"
          echo "path=upload/dsha-${GITHUB_REF_NAME}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 该作业没有 checkout，gh 无法从 .git 推断仓库，必须显式指定
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.apk.outputs.path }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DSHA ${GITHUB_REF_NAME}" \
            --generate-notes
